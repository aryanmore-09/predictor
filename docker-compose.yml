version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./predictor.db
      - SECRET_KEY=mit-cse-secret-key-super-secure-change-in-production-2026
      - ENVIRONMENT=production
    volumes:
      - ./backend/data:/app/data
      - ./backend/app/ml/models:/app/app/ml/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
